[build]
  command = "mkdir -p dist && cp index.html about.html services.html volunteers.html privacy.html consent.html consent-volunteers.html 404.html styles.css header.css script.js dist/ && cp -R assets calendar projects services dist/"

  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"
